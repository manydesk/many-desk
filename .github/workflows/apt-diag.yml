name: apt diagnosis
on:
  push:
    branches: [ci-apt-diag]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        pkgs:
          - "mingw-w64 cmake nasm"
          - "build-essential pkg-config clang nasm cmake libgtk-3-dev libssl-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxrandr-dev libxdo-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libxtst-dev libxi-dev libxkbcommon-dev libgl1-mesa-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: before
        run: |
          set -x
          cat /etc/apt/sources.list.d/ubuntu.sources
          ls /etc/apt/sources.list.d/ /etc/apt/apt.conf.d/ /etc/apt/preferences.d/ || true
          cat /etc/apt/preferences.d/* 2>/dev/null || true
          grep -rh . /etc/apt/apt.conf.d/ | grep -v '^//' | head -60
          dpkg --print-architecture; dpkg --print-foreign-architectures
          df -h / /var
      - name: install
        continue-on-error: true
        run: .github/apt-install.sh ${{ matrix.pkgs }}
      - name: after
        if: always()
        run: |
          set -x
          grep '^URIs' /etc/apt/sources.list.d/ubuntu.sources
          ls -la /var/lib/apt/lists/ | head -70
          apt-cache policy | head -40
          apt-cache policy cmake build-essential
          apt-get install -s --no-install-recommends cmake 2>&1 | tail -3
