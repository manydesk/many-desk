<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>probe</title>
<style>body { font: 13px monospace; white-space: pre-wrap; padding: 12px; }</style>
</head>
<body>
<div id="out">running…</div>
<script>
// WebView capability probe: every feature ManyDesk's renderer relies on.
// Results go to document.title ("DONE:<json>") so a native host can read them.
const R = {};
const step = async (name, fn, ms = 8000) => {
  try {
    R[name] = await Promise.race([fn(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  } catch (e) {
    R[name] = `FAIL: ${e && e.name ? e.name + ': ' : ''}${e && e.message ? e.message : e}`;
  }
  document.getElementById('out').textContent = JSON.stringify(R, null, 1);
};

(async () => {
  R.ua = navigator.userAgent;
  await step('rtc.api', async () => typeof RTCPeerConnection === 'function' && typeof RTCRtpSender === 'function' ? 'ok' : 'missing');
  await step('codecs.video', async () => RTCRtpSender.getCapabilities('video').codecs.map((c) => c.mimeType).filter((v, i, a) => a.indexOf(v) === i).join(' '));
  await step('codecs.audio', async () => RTCRtpSender.getCapabilities('audio').codecs.map((c) => c.mimeType).filter((v, i, a) => a.indexOf(v) === i).join(' '));
  await step('setCodecPreferences', async () => (typeof RTCRtpTransceiver !== 'undefined' && 'setCodecPreferences' in RTCRtpTransceiver.prototype ? 'ok' : 'missing'));

  // STUN: public address discovery
  await step('stun.srflx', async () => {
    const pc = new RTCPeerConnection({ iceServers: [{ urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302'] }] });
    pc.createDataChannel('x');
    const got = new Promise((res) => { pc.onicecandidate = (e) => { if (e.candidate && / typ srflx/.test(e.candidate.candidate)) res(e.candidate.candidate.split(' ')[4]); }; });
    await pc.setLocalDescription(await pc.createOffer());
    const ip = await got; pc.close(); return `ok (${ip})`;
  });

  // Loopback: data channel + canvas video track (encode → decode) + sender parameters
  await step('loopback', async () => {
    const a = new RTCPeerConnection(), b = new RTCPeerConnection();
    a.onicecandidate = (e) => e.candidate && b.addIceCandidate(e.candidate);
    b.onicecandidate = (e) => e.candidate && a.addIceCandidate(e.candidate);
    const c = document.createElement('canvas'); c.width = 640; c.height = 400;
    const g = c.getContext('2d'); let n = 0;
    const timer = setInterval(() => { g.fillStyle = `hsl(${(n++ * 20) % 360} 70% 50%)`; g.fillRect(0, 0, 640, 400); }, 50);
    const stream = c.captureStream(20);
    const track = stream.getVideoTracks()[0];
    track.contentHint = 'detail';
    const sender = a.addTrack(track, stream);
    const ch = a.createDataChannel('ctl');
    const msg = new Promise((res) => { b.ondatachannel = (e) => { e.channel.onmessage = (m) => res(m.data); }; });
    const video = new Promise((res) => { b.ontrack = (e) => res(e.streams[0]); });
    await a.setLocalDescription(await a.createOffer());
    await b.setRemoteDescription(a.localDescription);
    await b.setLocalDescription(await b.createAnswer());
    await a.setRemoteDescription(b.localDescription);
    ch.onopen = () => ch.send('ping');
    const text = await msg;
    let params = 'ok';
    try {
      const p = sender.getParameters(); if (!p.encodings.length) p.encodings = [{}];
      p.encodings[0].maxBitrate = 2_000_000; p.encodings[0].scaleResolutionDownBy = 2; p.degradationPreference = 'maintain-resolution';
      await sender.setParameters(p);
    } catch (e) { params = 'FAIL ' + e.message; }
    const v = document.createElement('video'); v.muted = true; v.autoplay = true; v.playsInline = true; v.srcObject = await video; document.body.appendChild(v);
    await new Promise((res) => { const t = setInterval(() => { if (v.videoWidth) { clearInterval(t); res(); } }, 100); });
    await new Promise((r) => setTimeout(r, 1500));
    let codec = '';
    (await a.getStats()).forEach((s) => { if (s.type === 'outbound-rtp' && s.kind === 'video' && s.codecId) codec = s.codecId; });
    (await a.getStats()).forEach((s) => { if (s.id === codec) codec = s.mimeType; });
    const size = `${v.videoWidth}x${v.videoHeight}`;
    clearInterval(timer); a.close(); b.close();
    return `ok · datachannel "${text}" · video ${size} · codec ${codec} · setParameters ${params}`;
  }, 15000);

  await step('crypto.pbkdf2+aes', async () => {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode('123456789'), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('s'), iterations: 200000 }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode('hi'));
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct)) === 'hi' ? 'ok' : 'mismatch';
  });
  await step('compression.deflate-raw', async () => {
    const pipe = async (bytes, s) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(s)).arrayBuffer());
    const raw = new TextEncoder().encode('x'.repeat(1000));
    const out = await pipe(await pipe(raw, new CompressionStream('deflate-raw')), new DecompressionStream('deflate-raw'));
    return out.length === 1000 ? 'ok' : 'mismatch';
  });
  await step('websocket.nostr', async () => new Promise((res, rej) => {
    const ws = new WebSocket('wss://relay.damus.io'); ws.onopen = () => { ws.close(); res('ok'); }; ws.onerror = () => rej(new Error('error'));
  }));
  await step('getUserMedia.audio', async () => {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    const label = s.getAudioTracks()[0].label; s.getTracks().forEach((t) => t.stop()); return `ok (${label})`;
  });
  await step('getDisplayMedia', async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return 'missing';
    const s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    const t = s.getVideoTracks()[0]; const st = t.getSettings();
    s.getTracks().forEach((x) => x.stop());
    return `ok (${st.width}x${st.height}, "${t.label}")`;
  }, 15000);

  R.done = true;
  document.getElementById('out').textContent = JSON.stringify(R, null, 1);
  document.title = 'DONE:' + JSON.stringify(R);
  try { window.webkit.messageHandlers.probe.postMessage(JSON.stringify(R)); } catch {}
  try { console.log('PROBE_RESULT ' + JSON.stringify(R)); } catch {}
})();
</script>
</body>
</html>
