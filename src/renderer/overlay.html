<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost">
  <title>ManyDesk overlay</title>
  <style>
    /* Transparent, click-through, excluded from screen capture: only the host sees it. */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .who {
      position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform;
      transition: opacity .4s;
    }
    .who.idle { opacity: .35; }
    .who.gone { opacity: 0; }
    .ring {
      position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%;
      border: 2.5px solid var(--c); box-sizing: border-box; background: color-mix(in srgb, var(--c) 18%, transparent);
    }
    .tag {
      position: absolute; left: 14px; top: 12px; white-space: nowrap; color: #fff; background: var(--c);
      padding: 3px 8px 3px 7px; border-radius: 4px 10px 10px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.35);
      display: flex; align-items: center; gap: 6px;
    }
    .tag small { font-weight: 500; opacity: .85; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .tag .act { font-weight: 500; opacity: .9; }
    .ripple {
      position: absolute; left: -18px; top: -18px; width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--c); box-sizing: border-box; animation: ripple .6s ease-out forwards;
    }
    @keyframes ripple { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  </style>
</head>
<body>
  <script src="overlay-bridge.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
